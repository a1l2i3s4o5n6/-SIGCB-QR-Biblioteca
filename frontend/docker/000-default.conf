<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Seguridad: cabeceras HTTP (I1)
    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"

    # Content-Security-Policy.
    #
    # Los orígenes externos no son adorno: las plantillas layouts/app.blade.php y
    # layouts/guest.blade.php cargan Font Awesome desde cdnjs y la tipografía
    # Poppins desde Google Fonts, y qr-codigos/index.blade.php carga qrcode.min.js
    # desde cdnjs. La política anterior sólo admitía 'self', de modo que el
    # navegador bloqueaba las tres cosas y las páginas se servían sin iconos, con
    # la tipografía de reserva y con el módulo de códigos QR inoperativo. El fallo
    # era silencioso: el servidor respondía 200 y sólo la consola del navegador lo
    # delataba. Lo detectó la auditoría Lighthouse (docs/mediciones/frontend/).
    #
    # Se declara cada host donde realmente se usa y en ninguna directiva más.
    # Deuda registrada: depender de CDN externas contradice la reproducibilidad
    # que ADR-0007 persigue en la capa de contenedores; alojar estos recursos en
    # el propio contenedor permitiría volver a 'self' en todas las directivas.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
