<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Seguridad: cabeceras HTTP (I1). Alpine requiere 'unsafe-eval';
    # Font Awesome y Google Fonts se cargan desde sus CDN.
    Header set X-Content-Type-Options "nosniff"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
# Content-Security-Policy.
    #
    # Alpine (usado en layouts) requiere 'unsafe-eval'. Los orígenes externos no
    # son adorno: layouts/app.blade.php y layouts/guest.blade.php cargan Font
    # Awesome desde cdnjs y Poppins desde Google Fonts, y el módulo de códigos QR
    # carga qrcode.min.js desde cdnjs. La política anterior sólo admitía 'self',
    # de modo que el navegador bloqueaba todo y las páginas se servían sin
    # iconos, con la tipografía de reserva y con el módulo QR inoperativo; el
    # fallo era silencioso (200 en servidor). Lo detectó Lighthouse.
    #
    # Se declara cada host donde realmente se usa y en ninguna directiva más.
    # Deuda registrada: depender de CDN externas contradice la reproducibilidad
    # que ADR-0007 persigue; alojar estos recursos en el propio contenedor
    # permitiría volver a 'self' en todas las directivas.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
