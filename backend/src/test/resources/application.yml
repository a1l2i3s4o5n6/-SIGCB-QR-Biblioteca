server:
  port: 0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sigcbqr_test}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Mismo bloque que application.yml (estos archivos coinciden en nombre y el
    # de test sombrea al principal en el classpath de pruebas): los placeholders
    # de V7 los suministra el arnés (scripts/run-tests.sh) como SEED_*_PASSWORD.
    placeholders:
      seed_admin_password: ${SEED_ADMIN_PASSWORD:}
      seed_biblio_password: ${SEED_BIBLIO_PASSWORD:}
      seed_student_password: ${SEED_STUDENT_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms

app:
  jwt:
    # Sin valor por defecto: lo suministra el arnés de pruebas (run-tests.sh,
    # CI) como TEST_JWT_SECRET. Ver docs/seguridad/SECRETOS.md.
    secret: ${TEST_JWT_SECRET}
    expiration-ms: 3600000
    issuer: sigcbqr-api-test
    audience: sigcbqr-frontend-test
    secure-cookie: false

  cors:
    allowed-origins: http://localhost:8000

  cache:
    default-ttl-seconds: 60

logging:
  level:
    com.sigcbqr: DEBUG
