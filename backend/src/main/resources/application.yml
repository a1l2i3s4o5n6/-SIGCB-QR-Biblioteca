server:
  port: 8080

spring:
  application:
    name: sigcb-qr-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sigcbqr}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Contraseñas de los usuarios semilla (V7). Llegan por variables de
    # entorno; con valor vacío la migración V7 las deja intactas (guarda
    # '${...}' <> ''). Nunca fijadas en código: ver docs/seguridad/SECRETOS.md.
    placeholders:
      seed_admin_password: ${SEED_ADMIN_PASSWORD:}
      seed_biblio_password: ${SEED_BIBLIO_PASSWORD:}
      seed_student_password: ${SEED_STUDENT_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
    issuer: ${JWT_ISSUER:sigcbqr-api}
    audience: ${JWT_AUDIENCE:sigcbqr-frontend}
    secure-cookie: ${JWT_SECURE_COOKIE:false}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}

  security:
    rate-limit:
      max-requests: ${RATE_LIMIT_MAX_REQUESTS:5}
      window-ms: ${RATE_LIMIT_WINDOW_MS:60000}

  cache:
    default-ttl-seconds: ${CACHE_DEFAULT_TTL_SECONDS:300}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.sigcbqr: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
