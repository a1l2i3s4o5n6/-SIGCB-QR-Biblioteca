name: SIGCB-QR CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Suite autocontenida y sin credenciales versionadas: levanta PostgreSQL
      # y Redis de prueba y ejecuta Maven en contenedor, generando contraseñas
      # efímeras por corrida (ver scripts/run-tests.sh). Sustituye al anterior
      # arnés de service containers con 'test123' fijo (OBS-23).
      - name: Build and test with Maven (contenedor)
        run: bash scripts/run-tests.sh

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

  validate-docs:
    name: Validar documentación y trazabilidad
    runs-on: ubuntu-latest
    steps:
      # Historia completa: validate-authors.py recorre TODOS los commits (git
      # log --no-merges) para comprobar la coherencia de autoría, igual que el
      # trabajo secret-scan. Sin fetch-depth=0, un clon superficial vería solo
      # el commit HEAD y la comprobación fallaría de forma engañosa.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Falla si la matriz cita una prueba o una evidencia que no existe en el
      # repositorio. Es la comprobación que impide repetir el problema de la
      # Tercera Entrega, donde se declararon como verificadas cuatro clases de
      # prueba inexistentes.
      - name: Matriz de trazabilidad
        run: bash scripts/validate-traceability.sh

      # Falla si un digest no tiene 64 caracteres hexadecimales o si una imagen
      # no está anclada. Un digest truncado rompe 'make up' al descargar.
      - name: Digests SHA256 de las imágenes
        run: python3 scripts/validate-digests.py

      # Falla si el índice de ADR y los archivos del directorio se desincronizan.
      - name: Índice de ADR
        run: bash scripts/validate-adr.sh

      # Coherencia de autoría: el .mailmap evita identidades duplicadas (un
      # correo, una persona) y las tres superficies (CONTRIBUTORS, CITATION.cff,
      # .zenodo.json) declaran los mismos integrantes.
      - name: Coherencia de autoría
        run: python3 scripts/validate-authors.py

      # Verifica la fórmula del SUS contra los casos canónicos de la literatura.
      - name: Fórmula SUS
        run: python3 scripts/sus-score.py --autotest

      # Los archivos de gobernanza que la guía de la entrega exige.
      - name: Archivos de gobernanza presentes
        run: |
          faltan=0
          for f in LICENSE ETHICS.md CHANGELOG.md CITATION.cff .zenodo.json \
                   docs/basedatos/DICCIONARIO-DATOS.md \
                   docs/mediciones/seguridad/OWASP-AUDIT.md \
                   docs/mediciones/cobertura/COBERTURA.md \
                   docs/mediciones/perf/REPORT.md \
                   docs/mediciones/frontend/LIGHTHOUSE.md \
                   docs/mediciones/usabilidad/SUS.md; do
            if [ ! -f "$f" ]; then echo "FALTA: $f"; faltan=$((faltan+1)); fi
          done
          if [ "$faltan" -gt 0 ]; then echo "Faltan $faltan archivo(s)"; exit 1; fi
          echo "Todos los archivos de gobernanza están presentes."

  # Escaneo de secretos. Se limita al commit HEAD (--log-opts=-n1) para no
  # fallar por la historia previa a la limpieza de OBS-23: la historia de Git
  # se conserva a propósito (riesgo residual, ver docs/seguridad/SECRETOS.md).
  # Cualquier secreto nuevo añadido en un commit posterior rompe la compilación.
  # Los archivos permitidos en .gitleaks.toml son los que documentan las
  # credenciales de desarrollo por diseño (.env.example e inventarios).
  secret-scan:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (HEAD)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --log-opts="-n1" --no-banner --redact