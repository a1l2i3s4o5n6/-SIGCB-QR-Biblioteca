services:
  postgres:
    image: postgres@sha256:2f7e3f7c4c6d5b8e3a9f0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e
    container_name: sigcbqr-postgres
    environment:
      POSTGRES_DB: sigcbqr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Doctora2025
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./db/procs:/docker-entrypoint-initdb.d/procs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis@sha256:5c1c8b9a0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7
    container_name: sigcbqr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4@sha256:3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4
    container_name: sigcbqr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sigcbqr.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build: ./sigcb-qr-api
    container_name: sigcbqr-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sigcbqr
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Doctora2025
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./SIGCB-QR
    container_name: sigcbqr-frontend
    ports:
      - "8000:80"
    environment:
      APP_NAME: "SIGCB-QR"
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
