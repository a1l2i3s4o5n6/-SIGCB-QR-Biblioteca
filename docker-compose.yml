services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    container_name: sigcbqr-postgres
    environment:
      POSTGRES_DB: sigcbqr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Doctora2025
      TZ: America/Guayaquil
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    container_name: sigcbqr-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    container_name: sigcbqr-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sigcbqr.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  api:
    build: ./backend
    container_name: sigcbqr-api
    ports:
      - "8080:8080"
    environment:
      TZ: America/Guayaquil
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sigcbqr
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Doctora2025
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_MVC_LOG_RESOLVED_EXCEPTION: "true"
      JWT_SECRET: YJmzpR1cx9oYiDuBEFK6U0BNLdB1uymzqpPrINxBzOwUlNp8VNxX7/AL5wTNbbQm
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Guayaquil
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: sigcbqr-frontend
    ports:
      - "8000:80"
    environment:
      TZ: America/Guayaquil
      APP_NAME: "SIGCB-QR"
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      APP_TIMEZONE: America/Guayaquil
      APP_LOCALE: es
    depends_on:
      - api

volumes:
  pgdata:
